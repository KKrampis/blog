baseURL = '/'
languageCode = 'en-us'
title = 'Prof. Krampis Blog'
theme = "hugo-theme-relearn"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]']]
          inline = [['$', '$']]

[params]
  math = true
  showVisitedLinks = true

