baseURL = '/'
languageCode = 'en-us'
title = 'Prof. Krampis Blog'
theme = "hugo-theme-relearn"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['++++', '++++']]

[params]
  math = true
  themeVariant = ['zen-dark', 'zen-light']
  linkTitle = 'AI Interpretability Writings'
